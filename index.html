<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac for building maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0;        /* لون الخلفية المستوحى من اللوجو */
            --card-bg: #ffffff;
            --primary-navy: #11223b;    /* اللون الكحلي المستوحى من حروف اللوجو */
            --accent-bronze: #b87d4b;   /* اللون النحاسي المعدني المستوحى من السهم */
            --text-muted: #626d7d;
            --border-subtle: rgba(184, 125, 75, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-navy);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .profile-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            padding: 40px 30px;
            box-shadow: 0 18px 40px rgba(17, 34, 59, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border-subtle);
            position: relative;
        }

        /* Logo Area */
        .logo-wrapper {
            width: 135px;
            height: 135px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(17, 34, 59, 0.1);
            margin-bottom: 24px;
            border: 2px solid var(--accent-bronze);
            padding: 6px;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Typography matching the logo style */
        h1 {
            font-family: 'Cinzel', serif; /* خط فخم وملكي يناسب اسم الشركة في اللوجو */
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-navy);
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-bronze);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 32px;
            text-align: center;
        }

        /* Links List */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            text-decoration: none;
            background: #faf9f6;
            color: var(--primary-navy);
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 1px solid #ebe6de;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-item i.brand-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .link-item .arrow-icon {
            font-size: 12px;
            color: #b5aaa0;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* Hover Effects */
        .link-item:hover {
            background-color: var(--primary-navy);
            color: #ffffff;
            border-color: var(--primary-navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 34, 59, 0.15);
        }

        .link-item:hover .arrow-icon {
            color: #ffffff;
            transform: translateX(-3px);
        }

        .link-item:hover i.brand-icon {
            transform: scale(1.1);
        }

        /* Brand Specific Colors on Hover */
        .link-web:hover i { color: #38bdf8; }
        .link-wa i { color: #25d366; }
        .link-wa:hover i { color: #25d366 !important; }
        .link-ig i { color: #E4405F; }
        .link-ig:hover i { color: #E4405F !important; }
        .link-fb i { color: #1877F2; }
        .link-fb:hover i { color: #1877F2 !important; }
        .link-tk i { color: #000000; }
        .link-tk:hover i { color: #ffffff !important; }
        .link-sc i { color: #FFFC00; }
        .link-sc:hover i { color: #FFFC00 !important; }
        .link-phone i { color: var(--accent-bronze); }
        .link-phone:hover i { color: var(--accent-bronze) !important; }

        /* Footer */
        .footer {
            margin-top: 35px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.5px;
        }

        @media (max-width: 420px) {
            .profile-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="logo-wrapper">
            <img src="IMG_7478.jpeg" alt="Tic Tac Logo">
        </div>

        <h1>Tic Tac</h1>
        <div class="subtitle">Building Maintenance</div>

        <div class="links-list">
