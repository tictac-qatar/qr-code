<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac | Building Maintenance</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0e5ec; /* Soft Neumorphic Background */
            --primary-gradient: linear-gradient(145deg, #1e3c72, #2a5298); /* Deep Blue Gradient */
            --text-color: #333;
            --sub-text: #666;
            --accent-gold: #d4af37;
            --shadow: 6px 6px 12px #bec8d2, -6px -6px 12px #ffffff;
            --inner-shadow: inset 6px 6px 12px #bec8d2, inset -6px -6px 12px #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            background: var(--bg-color);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Section */
        .logo-container {
            width: 140px;
            height: 140px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            padding: 10px;
            position: relative;
        }

        .logo-container::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            opacity: 0.5;
        }

        .logo-container img {
            max-width: 80%;
            height: auto;
        }

        /* Text Info */
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--sub-text);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Links Section */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .neo-btn {
            text-decoration: none;
            color: #fff;
            background: var(--primary-gradient);
            padding: 16px 25px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .neo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 15px #bec8d2, -8px -8px 15px #ffffff;
            background: linear-gradient(145deg, #2a5298, #1e3c72);
        }

        .neo-btn:active {
            box-shadow: var(--inner-shadow);
            transform: translateY(1px);
        }

        .neo-btn i {
            font-size: 20px;
        }

        /* Specific Brand Colors (subtle accent on icon) */
        .btn-whatsapp i { color: #25d366; }
        .btn-instagram i { color: #e4405f; }
        .btn-facebook i { color: #1877f2; }
        .btn-tiktok i { color: #000; }
        .btn-snapchat i { color: #fffc00; }
        
        /* Contact Info Box (Styled same as buttons) */
        .contact-box {
            margin-top: 18px;
            background: #ffffff; /* Different base for contrast */
            color: var(--primary-color);
            padding: 16px 25px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--shadow);
            width: 100%;
            border: 2px solid var(--accent-gold);
            color: #1e3c72;
        }
        
        .contact-box i {
            color: var(--accent-gold);
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #aaa;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 420px) {
            .main-container {
                padding: 30px;
            }
            .logo-container {
                width: 120px;
                height: 120px;
            }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo -->
        <div class="logo-container">
            <!-- ضع رابط اللوجو الخاص بك هنا بدلاً من logo.png -->
            <img src="logo.png" alt="Tic Tac Logo">
        </div>

        <!-- Company Info -->
        <h1>TIC TAC</h1>
        <p class="subtitle">Building Maintenance</p>

        <!-- Links -->
        <div class="links-wrapper">
            <a href="https://tictac-qatar.github.io/tictac.qatar/" class="neo-btn btn-website">
                <i class="fas fa-globe"></i> Visit Our Website
            </a>
            <a href="https://wa.me/message/3TNMR3QW5DC3D1" class="neo-btn btn-whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> Chat on WhatsApp
            </a>
            <a href="https://www.instagram.com/tictac.qatar?igsi=MWx3NnBhYWU1Ymljcg==" class="neo-btn btn-instagram" target="_blank">
                <i class="fab fa-instagram"></i> Follow on Instagram
            </a>
            <a href="https://www.facebook.com/share/19C2QxxfqK/?mibextid=wwXIfr" class="neo-btn btn-facebook" target="_blank">
                <i class="fab fa-facebook-f"></i> Like on Facebook
            </a>
            <a href="https://www.tiktok.com/@tictac.qatar?_r=1&_t=ZS-99JTXTu6Hp4" class="neo-btn btn-tiktok" target="_blank">
                <i class="fab fa-tiktok"></i> Watch on TikTok
            </a>
            <a href="https://snapchat.com/t/sM1SPoYB" class="neo-btn btn-snapchat" target="_blank">
                <i class="fab fa-snapchat-ghost"></i> Add on Snapchat
            </a>
            
            <!-- Contact Box (Same size as buttons) -->
            <div class="contact-box">
                <i class="fas fa-phone-alt"></i>
                <span>88806077</span>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            &copy; 2026 Tic Tac for building maintenance. All rights reserved.
        </footer>
    </div>

</body>
</html>
