<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac | Building Maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f4f1ea;
            --card-bg: #ffffff;
            --primary: #0b192c;
            --accent: #b8860b;
            --text-main: #0b192c;
            --text-muted: #64748b;
            --border-color: rgba(184, 134, 11, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(184, 134, 11, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(11, 25, 44, 0.03) 0px, transparent 50%);
        }

        .profile-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 32px;
            padding: 40px 28px;
            box-shadow: 0 20px 45px -10px rgba(11, 25, 44, 0.07), 0 0 0 1px rgba(11, 25, 44, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative top accent line */
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
        }

        /* Logo Styling */
        .logo-frame {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(11, 25, 44, 0.08);
            margin-bottom: 20px;
            border: 2px solid var(--accent);
            padding: 6px;
            position: relative;
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Titles */
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            text-align: center;
        }

        .badge-subtitle {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(184, 134, 11, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(184, 134, 11, 0.15);
        }

        /* Links List */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .action-link {
            text-decoration: none;
            background: #fafaf9;
            color: var(--primary);
            padding: 16px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e7e5e4;
            position: relative;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .action-link i.icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .action-link .external-icon {
            font-size: 12px;
            color: #a8a29e;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* Hover States */
        .action-link:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(11, 25, 44, 0.12);
        }

        .action-link:hover .external-icon {
            color: #ffffff;
            transform: translate(2px, -2px);
        }

        .action-link:hover i.icon {
            transform: scale(1.1);
        }

        /* Brand Icon Custom Colors */
        .link-web:hover i { color: #38bdf8; }
        .link-wa i { color: #22c55e; }
        .link-wa:hover i { color: #22c55e !important; }
        
        .link-ig i { color: #ec4899; }
        .link-ig:hover i { color: #ec4899 !important; }
        
        .link-fb i { color: #3b82f6; }
        .link-fb:hover i { color: #3b82f6 !important; }
        
        .link-tk i { color: #000000; }
        .link-tk:hover i { color: #ffffff !important; }
        
        .link-sc i { color: #eab308; }
        .link-sc:hover i { color: #eab308 !important; }
        
        .link-phone i { color: var(--accent); }
        .link-phone:hover i { color: var(--accent) !important; }

        /* Footer */
        .footer-text {
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.3px;
        }

        @media (max-width: 420px) {
            .profile-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="logo-frame">
            <img src="IMG_7478.jpeg" alt="Tic Tac Logo">
        </div>

        <h1>Tic Tac</h1>
        <div class="badge-subtitle">Building Maintenance</div>

        <div class="links-container">
            <a href="https://tictac-qatar.github.io/tictac.qatar/" class="action-link link-web">
                <div class="link-content">
                    <i class="fas fa-globe icon"></i>
                    <span>Official Website</span>
                </div>
                <i class="fas fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <a href="https://wa.me/message/3TNMR3QW5DC3D1" class="action-link link-wa" target="_blank">
                <div class="link-content">
                    <i class="fab fa-whatsapp icon"></i>
                    <span>WhatsApp Support</span>
                </div>
                <i class="fas fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <a href="https://www.instagram.com/tictac.qatar?igsi=MWx3NnBhYWU1Ymljcg==" class="action-link link-ig" target="_blank">
                <div class="link-content">
                    <i class="fab fa-instagram icon"></i>
                    <span>Instagram</span>
                </div>
                <i class="fas fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <a href="https://www.facebook.com/share/19C2QxxfqK/?mibextid=wwXIfr" class="action-link link-fb" target="_blank">
                <div class="link-content">
