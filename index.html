<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac for building maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0; /* نفس لون خلفية اللوجو */
            --primary-color: #132238; /* لون كحلي داكن مطابق لحروف اللوجو */
            --accent-bronze: #b87d4b; /* لون نحاسي مستوحى من سهم اللوجو */
            --card-bg: #ffffff;
            --text-main: #132238;
            --text-muted: #5a6578;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 12px 35px rgba(19, 34, 56, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(184, 125, 75, 0.15);
        }

        /* Logo Section */
        .logo-container {
            width: 130px;
            height: 130px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(19, 34, 56, 0.08);
            margin-bottom: 20px;
            padding: 8px;
            border: 2px solid var(--accent-bronze);
        }

        .logo-container img {
            max-width: 85%;
            height: auto;
            object-fit: contain;
        }

        /* Text Info */
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--accent-bronze);
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Links Section */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            text-decoration: none;
            color: var(--primary-color);
            background-color: #fbfbfb;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(19, 34, 56, 0.03);
            border: 1px solid #eef0f3;
            width: 100%;
        }

        .link-btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-btn i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .link-btn .arrow-icon {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .link-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(19, 34, 56, 0.15);
        }

        .link-btn:hover .arrow-icon {
            color: #ffffff;
            transform: translateX(-3px);
        }

        /* Brand Icon Colors */
        .btn-website:hover i { color: #ffffff; }
        .btn-whatsapp i { color: #25d366; }
        .btn-instagram i { color: #E4405F; }
        .btn-facebook i { color: #1877F2; }
        .btn-tiktok i { color: #000000; }
        .btn-snapchat i { color: #FFFC00; }
        .btn-phone i { color: var(--accent-bronze); }

        .link-btn:hover i {
            color: #ffffff !important;
        }

        /* Footer */
        footer {
            margin-top: 35px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 420px) {
            .main-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-container">
            <img src="IMG_7478.jpeg" alt="Tic Tac Logo">
        </div>

        <h1>Tic Tac</h1>
        <p class="subtitle">Building Maintenance</p>

        <div class="links-wrapper">
            <a href="https://tictac-qatar.github.io/tictac.qatar/" class="link-btn btn-website">
                <div class="link-btn-content">
                    <i class="fas fa-globe"></i>
                    <span>Official Website</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://wa.me/message/3TNMR3QW5DC3D1" class="link-btn btn-whatsapp" target="_blank">
                <div class="link-btn-content">
                    <i class="fab fa-whatsapp"></i>
                    <span>WhatsApp Chat</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://www.instagram.com/tictac.qatar?igsi=MWx3NnBhYWU1Ymljcg==" class="link-btn btn-instagram" target="_blank">
                <div class="link-btn-content">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://www.facebook.com/share/19C2QxxfqK/?mibextid=wwXIfr" class="link-btn btn-facebook" target="_blank">
                <div class="link-btn-content">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://www.tiktok.com/@tictac.qatar?_r=1&_t=ZS-99JTXTu6Hp4" class="link-btn btn-tiktok" target="_blank">
                <div class="link-btn-content">
                    <i class="fab fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://snapchat.com/t/sM1SPoYB" class="link-btn btn-snapchat" target="_blank">
                <div class="link-btn-content">
                    <i class="fab fa-snapchat-ghost"></i>
                    <span>Snapchat</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
            
            <a href="tel:88806077" class="link-btn btn-phone">
                <div class="link-btn-content">
                    <i class="fas fa-phone-alt"></i>
                    <span>88806077</span>
                </div>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <footer>
            &copy; 2026 Tic Tac for building maintenance. All rights reserved.
        </footer>
    </div>

</body>
</html>
