<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac for building maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0f2d4a;
            --accent-color: #c59b27;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 22px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
            font-weight: 500;
        }

        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-list a, .contact-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background-color: #ffffff;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #edf2f7;
            width: 100%;
            box-sizing: border-box;
        }

        .link-list a:hover, .contact-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            border-color: transparent;
        }

        .link-list a i {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        /* Brand Specific Colors on Hover / Accent */
        .link-list a.website:hover { background-color: #0f2d4a; color: #fff; }
        .link-list a.whatsapp { color: #25d366; }
        .link-list a.whatsapp:hover { background-color: #25d366; color: #fff; }
        
        .link-list a.instagram { color: #E4405F; }
        .link-list a.instagram:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; border-color: transparent; }
        
        .link-list a.facebook { color: #1877F2; }
        .link-list a.facebook:hover { background-color: #1877F2; color: #fff; }
        
        .link-list a.tiktok { color: #000000; }
        .link-list a.tiktok:hover { background-color: #000000; color: #fff; }
        
        .link-list a.snapchat { color: #FFFC00; background-color: #fff; }
        .link-list a.snapchat:hover { background-color: #FFFC00; color: #000; }

        /* Contact Box styled identically to links */
        .contact-card {
            background-color: #ffffff;
            color: var(--text-main);
            margin-top: 0;
            cursor: pointer;
        }
        .contact-card i {
            color: var(--accent-color);
            font-size: 20px;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }
    </style>
</head>
